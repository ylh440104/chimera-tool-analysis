name: chimera-drive
on:
  workflow_dispatch:
  push:
jobs:
  drive:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Get samples and tools
      shell: pwsh
      run: '$base="${{ github.server_url }}/${{ github.repository }}/releases/download/samples"

        foreach($n in @("ChimeraInstaller.exe","ChimeraTool_Authenticator_Driver.exe")){Invoke-WebRequest "$base/$n" -OutFile $n -TimeoutSec 300}

        Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile pd.zip

        Expand-Archive pd.zip -DestinationPath pd -Force

        Rename-Item installer.exe ChimeraInstaller_run.exe -ErrorAction SilentlyContinue

        Rename-Item ChimeraInstaller.exe ChimeraInstaller_run.exe -ErrorAction SilentlyContinue

        Rename-Item authdrv.exe ChimeraTool_Authenticator_Driver_run.exe -ErrorAction SilentlyContinue

        Rename-Item ChimeraTool_Authenticator_Driver.exe ChimeraTool_Authenticator_Driver_run.exe -ErrorAction SilentlyContinue

        Get-ChildItem *.exe | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host'
    - name: Baseline
      shell: pwsh
      run: '

        $dirs=@("$env:TEMP","$env:ProgramData","$env:LOCALAPPDATA","$env:APPDATA","C:\Program Files","C:\Program Files (x86)","C:\Windows\System32\drivers","C:\Windows\System32\DriverStore")

        $rows=foreach($d in $dirs){if(Test-Path $d){Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue|Select-Object @{n=''p'';e={$_.FullName}},Length}}

        $rows|Export-Csv before.csv -NoTypeInformation -Encoding UTF8

        '
    - name: Drive authdrv
      shell: pwsh
      timeout-minutes: 10
      env:
        TARGET_EXE: ChimeraTool_Authenticator_Driver_run.exe
        TARGET_TAG: auth
        TARGET_ITER: '14'
      run: "\n$ErrorActionPreference='Continue'\nAdd-Type -AssemblyName System.Windows.Forms,System.Drawing\nAdd-Type @\"\nusing System;\nusing System.Runtime.InteropServices;\nusing System.Text;\npublic class Win {\n  [DllImport(\"user32.dll\")] public static extern bool EnumChildWindows(IntPtr h, EnumProc cb, IntPtr l);\n  [DllImport(\"user32.dll\", CharSet=CharSet.Auto)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int m);\n  [DllImport(\"user32.dll\")] public static extern int GetClassName(IntPtr h, StringBuilder s, int m);\n  [DllImport(\"user32.dll\")] public static extern bool GetWindowRect(IntPtr h, out RECT r);\n  [DllImport(\"user32.dll\")] public static extern bool SetCursorPos(int x, int y);\n  [DllImport(\"user32.dll\")] public static extern void mouse_event(uint f, int x, int y, int d, IntPtr e);\n  [DllImport(\"user32.dll\")] public static extern bool SetForegroundWindow(IntPtr h);\n  public delegate bool EnumProc(IntPtr h, IntPtr l);\n  [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L,T,R,B; }\n  public static string T(IntPtr h){ var s=new StringBuilder(512); GetWindowText(h,s,512); return s.ToString(); }\n  public static string C(IntPtr h){ var s=new StringBuilder(256); GetClassName(h,s,256); return s.ToString(); }\n}\n\"@\nfunction Shot($f){$b=New-Object System.Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width,[System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height);$g=[System.Drawing.Graphics]::FromImage($b);$g.CopyFromScreen(0,0,0,0,$b.Size);$b.Save($f);$g.Dispose();$b.Dispose()}\nfunction ClickIt($h){ $r=New-Object Win+RECT; if([Win]::GetWindowRect($h,[ref]$r)){ $x=[int](($r.L+$r.R)/2);$y=[int](($r.T+$r.B)/2); [Win]::SetCursorPos($x,$y)|Out-Null; [Win]::mouse_event(2,0,0,0,[IntPtr]::Zero); [Win]::mouse_event(4,0,0,0,[IntPtr]::Zero); Write-Host \"  click $x,$y [$([Win]::T($h))]\" } }\n$exe = $env:TARGET_EXE\n$tag = $env:TARGET_TAG\n$iter = [int]$env:TARGET_ITER\n$p = Start-Process\
        \ -FilePath $exe -PassThru\nStart-Sleep 22\nfor ($i=0; $i -lt $iter; $i++) {\n  Shot \"$tag-$i.png\"\n  $script:found = @()\n  if ($p.MainWindowHandle -ne 0) {\n    [Win]::SetForegroundWindow($p.MainWindowHandle) | Out-Null\n    [Win]::EnumChildWindows($p.MainWindowHandle, { param($h,$l) $c=[Win]::C($h); $t=[Win]::T($h); if ($c -match 'Button' -and $t) { $script:found += ,@($h,$t) }; return $true }, [IntPtr]::Zero) | Out-Null\n  }\n  Write-Host \"iter $i hwnd=$($p.MainWindowHandle) buttons=$($script:found.Count)\"\n  foreach ($b in $script:found) { Write-Host \"    [$($b[1])]\" }\n  $act = $script:found | Where-Object { $_[1] -match 'Next|Install|Yes|OK|Continue|Agree' } | Select-Object -First 1\n  if (-not $act) { Write-Host '  nothing to click'; break }\n  ClickIt $act[0]\n  Start-Sleep 9\n}\nShot \"$tag-final.png\"\nGet-Process | Where-Object { $_.ProcessName -match 'chimera|setup|install|suf_|irsetup|auth' } | Format-Table Id,ProcessName,MainWindowTitle -AutoSize | Out-String | Write-Host\nGet-Service | Where-Object { $_.Name -match 'chimera|auth|dongle|hasp|sentinel' } | Format-Table Name,Status,PathName -AutoSize | Out-String | Write-Host\nWrite-Host '=== recent .sys in drivers ==='\nGet-ChildItem 'C:\\Windows\\System32\\drivers' -Filter *.sys -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-12) } | Format-Table Name,Length,LastWriteTime -AutoSize | Out-String | Write-Host\nWrite-Host '=== Chimera dirs ==='\nGet-ChildItem 'C:\\Program Files','C:\\Program Files (x86)',\"$env:ProgramData\",\"$env:LOCALAPPDATA\" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'chimera' } | Select-Object FullName | Out-String | Write-Host\nWrite-Host '=== recent .dmp ==='\nGet-ChildItem . -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host\nif ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }\n"
    - name: Drive main installer
      shell: pwsh
      timeout-minutes: 16
      env:
        TARGET_EXE: ChimeraInstaller_run.exe
        TARGET_TAG: inst
        TARGET_ITER: '22'
      run: "\n$ErrorActionPreference='Continue'\nAdd-Type -AssemblyName System.Windows.Forms,System.Drawing\nAdd-Type @\"\nusing System;\nusing System.Runtime.InteropServices;\nusing System.Text;\npublic class Win {\n  [DllImport(\"user32.dll\")] public static extern bool EnumChildWindows(IntPtr h, EnumProc cb, IntPtr l);\n  [DllImport(\"user32.dll\", CharSet=CharSet.Auto)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int m);\n  [DllImport(\"user32.dll\")] public static extern int GetClassName(IntPtr h, StringBuilder s, int m);\n  [DllImport(\"user32.dll\")] public static extern bool GetWindowRect(IntPtr h, out RECT r);\n  [DllImport(\"user32.dll\")] public static extern bool SetCursorPos(int x, int y);\n  [DllImport(\"user32.dll\")] public static extern void mouse_event(uint f, int x, int y, int d, IntPtr e);\n  [DllImport(\"user32.dll\")] public static extern bool SetForegroundWindow(IntPtr h);\n  public delegate bool EnumProc(IntPtr h, IntPtr l);\n  [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L,T,R,B; }\n  public static string T(IntPtr h){ var s=new StringBuilder(512); GetWindowText(h,s,512); return s.ToString(); }\n  public static string C(IntPtr h){ var s=new StringBuilder(256); GetClassName(h,s,256); return s.ToString(); }\n}\n\"@\nfunction Shot($f){$b=New-Object System.Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width,[System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height);$g=[System.Drawing.Graphics]::FromImage($b);$g.CopyFromScreen(0,0,0,0,$b.Size);$b.Save($f);$g.Dispose();$b.Dispose()}\nfunction ClickIt($h){ $r=New-Object Win+RECT; if([Win]::GetWindowRect($h,[ref]$r)){ $x=[int](($r.L+$r.R)/2);$y=[int](($r.T+$r.B)/2); [Win]::SetCursorPos($x,$y)|Out-Null; [Win]::mouse_event(2,0,0,0,[IntPtr]::Zero); [Win]::mouse_event(4,0,0,0,[IntPtr]::Zero); Write-Host \"  click $x,$y [$([Win]::T($h))]\" } }\n$exe = $env:TARGET_EXE\n$tag = $env:TARGET_TAG\n$iter = [int]$env:TARGET_ITER\n$p = Start-Process\
        \ -FilePath $exe -PassThru\nStart-Sleep 22\nfor ($i=0; $i -lt $iter; $i++) {\n  Shot \"$tag-$i.png\"\n  $script:found = @()\n  if ($p.MainWindowHandle -ne 0) {\n    [Win]::SetForegroundWindow($p.MainWindowHandle) | Out-Null\n    [Win]::EnumChildWindows($p.MainWindowHandle, { param($h,$l) $c=[Win]::C($h); $t=[Win]::T($h); if ($c -match 'Button' -and $t) { $script:found += ,@($h,$t) }; return $true }, [IntPtr]::Zero) | Out-Null\n  }\n  Write-Host \"iter $i hwnd=$($p.MainWindowHandle) buttons=$($script:found.Count)\"\n  foreach ($b in $script:found) { Write-Host \"    [$($b[1])]\" }\n  $act = $script:found | Where-Object { $_[1] -match 'Next|Install|Yes|OK|Continue|Agree' } | Select-Object -First 1\n  if (-not $act) { Write-Host '  nothing to click'; break }\n  ClickIt $act[0]\n  Start-Sleep 9\n}\nShot \"$tag-final.png\"\nGet-Process | Where-Object { $_.ProcessName -match 'chimera|setup|install|suf_|irsetup|auth' } | Format-Table Id,ProcessName,MainWindowTitle -AutoSize | Out-String | Write-Host\nGet-Service | Where-Object { $_.Name -match 'chimera|auth|dongle|hasp|sentinel' } | Format-Table Name,Status,PathName -AutoSize | Out-String | Write-Host\nWrite-Host '=== recent .sys in drivers ==='\nGet-ChildItem 'C:\\Windows\\System32\\drivers' -Filter *.sys -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-12) } | Format-Table Name,Length,LastWriteTime -AutoSize | Out-String | Write-Host\nWrite-Host '=== Chimera dirs ==='\nGet-ChildItem 'C:\\Program Files','C:\\Program Files (x86)',\"$env:ProgramData\",\"$env:LOCALAPPDATA\" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'chimera' } | Select-Object FullName | Out-String | Write-Host\nWrite-Host '=== recent .dmp ==='\nGet-ChildItem . -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host\nif ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }\n"
    - name: Collect
      shell: pwsh
      run: '

        $dirs=@("$env:TEMP","$env:ProgramData","$env:LOCALAPPDATA","$env:APPDATA","C:\Program Files","C:\Program Files (x86)","C:\Windows\System32\drivers","C:\Windows\System32\DriverStore")

        $rows=foreach($d in $dirs){if(Test-Path $d){Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue|Select-Object @{n=''p'';e={$_.FullName}},Length}}

        $rows|Export-Csv after.csv -NoTypeInformation -Encoding UTF8

        $b=@{};Import-Csv before.csv|ForEach-Object{$b[$_.p]=1}

        $new=@();Import-Csv after.csv|ForEach-Object{if(-not $b.ContainsKey($_.p)){$new+= $_}}

        $new|Export-Csv newfiles.csv -NoTypeInformation -Encoding UTF8

        Write-Host "NEW: $($new.Count)"

        $new|Where-Object{$_.p -match ''\.(sys|inf|cat|dll|exe|dat|bin)$''}|Select-Object p,Length|Format-Table -AutoSize|Out-String -Width 400|Write-Host

        New-Item -ItemType Directory -Force harvested|Out-Null

        $new|Where-Object{$_.p -match ''\.(sys|inf|cat|dat|bin|dll|exe)$''}|ForEach-Object{try{Copy-Item $_.p "harvested\$([IO.Path]::GetFileName($_.p))" -Force -ErrorAction Stop}catch{}}

        Get-ChildItem harvested|Select-Object Name,Length|Format-Table -AutoSize|Out-String|Write-Host

        '
    - uses: actions/upload-artifact@v4
      with:
        name: chimera-drive
        path: '*.png

          newfiles.csv

          harvested/

          '
        compression-level: 6
        if-no-files-found: warn
'on': null
